[project]
name = "g1-motion-library"
version = "0.1.0"
description = "G1 motion references, terrain pairs, generation tools, and a video gallery"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "mujoco>=3.3,<4",
  "mink>=0.0.12",
  "daqp>=0.6",
  "trimesh>=4.0,<5",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
kimodo = ["kimodo", "torch>=2.7,<3", "torchvision>=0.22"]

[dependency-groups]
dev = ["ruff>=0.14", "playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_generator"]

[tool.uv.sources]
kimodo = { git = "https://github.com/nv-tlabs/kimodo.git", rev = "e1c219c99b4b94ba48be1fb6a1cbc64ecee4c954" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Isaac Lab intentionally parses launcher arguments before importing backend modules.
"data_generator/shared/export_mimic.py" = ["E402"]
"integrations/isaaclab/play_motion_file.py" = ["E402"]
