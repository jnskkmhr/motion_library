name: Publish motion gallery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r docs data _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=docs/"><title>G1 Motion Library</title><a href="docs/">Open the motion gallery</a>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
